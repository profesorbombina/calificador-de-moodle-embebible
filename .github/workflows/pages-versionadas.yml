name: Publicar vista previa V2

on:
  push:
    branches:
      - codex/v2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-preview-v2
  cancel-in-progress: false

jobs:
  publish-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Preparar sitio publicado
        uses: actions/checkout@v4
        with:
          ref: main
          path: published

      - name: Preparar vista previa V2
        uses: actions/checkout@v4
        with:
          ref: codex/v2
          path: preview

      - name: Actualizar exclusivamente la ruta V2
        shell: bash
        run: |
          mkdir -p published/v2
          cp preview/index.html preview/README.md published/v2/
          touch published/.nojekyll

      - name: Publicar cambios en main
        working-directory: published
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nojekyll v2/index.html v2/README.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: actualizar vista previa v2"
          git push origin main
