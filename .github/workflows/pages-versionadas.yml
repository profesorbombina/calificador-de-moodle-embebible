name: Publicar versiones en GitHub Pages

on:
  push:
    branches:
      - codex/v2
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Preparar version estable
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable

      - name: Preparar vista previa V2
        uses: actions/checkout@v4
        with:
          ref: codex/v2
          path: preview

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefacto
        shell: bash
        run: |
          mkdir -p site/v2
          cp stable/index.html stable/README.md site/
          cp preview/index.html preview/README.md site/v2/
          touch site/.nojekyll

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
